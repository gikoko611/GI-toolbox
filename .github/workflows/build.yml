name: Build GIToolbox APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle Burmese fonts (Padauk, SIL OFL)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fL --retry 3 -o app/src/main/assets/fonts/padauk_regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/padauk/Padauk-Regular.ttf
          curl -fL --retry 3 -o app/src/main/assets/fonts/padauk_bold.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/padauk/Padauk-Bold.ttf
          ls -l app/src/main/assets/fonts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report build errors as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 200 build.log > report.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Build failed $(git rev-parse --short HEAD)" --body-file report.txt

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GIToolbox-v3.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIToolbox-v3.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0
          name: GIToolbox v3.0
          body: 'GIToolbox v3.0 - FULL NATIVE Android app (no WebView). 300 tools, 12 categories, ALL-NEW 3D Nebula Green UI with entrance animations, ripple touch, elevation shadows. Sensors, GPS, camera, audio + video engines (GIF maker, video tools), QR + barcode engine, PDF engine, network suite (30+ tools), App Lock, File Checksum, bundled Padauk Burmese fonts (SIL OFL). Works on Android 8+ / armeabi-v7a (Redmi 9A). POWERED BY I KO KO'
          files: GIToolbox-v3.0.apk
          make_latest: true
