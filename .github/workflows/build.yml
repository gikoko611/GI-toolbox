name: Build GIToolbox APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GIToolbox-v2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIToolbox-v2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: GIToolbox v2.0
          body: 'GIToolbox v2.0 - FULL NATIVE Android app (no WebView). 300 tools, 12 categories, native UI, sensors, camera, GPS, audio recorder, QR engine, PDF engine, network tools. Works on Android 8+ / armeabi-v7a (Redmi 9A). POWERED BY I KO KO'
          files: GIToolbox-v2.0.apk
          make_latest: true
