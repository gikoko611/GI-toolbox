plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gikoko.gitoolbox'
    compileSdk 34

    defaultConfig {
        applicationId "com.gikoko.gitoolbox"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "0.0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress = ["ttf"]
    }
}
