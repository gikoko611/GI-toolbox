<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04150E">
<title>GIToolbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',system-ui,Arial,sans-serif}
html,body{height:100%;overflow:hidden;background:#04150E;color:#eafff4}
button,input,select,textarea{outline:none}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% -20%,#0a2e1c 0%,#051510 40%,#020a06 100%);z-index:0}
#grid{position:absolute;bottom:-18%;left:-30%;width:160%;height:62%;background:linear-gradient(rgba(0,255,150,.20) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,150,.20) 1px,transparent 1px);background-size:44px 44px;transform:perspective(420px) rotateX(62deg);animation:gm 3s linear infinite;-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 75%);mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 75%)}
@keyframes gm{from{background-position:0 0}to{background-position:0 44px}}
.orb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.28;animation:of 12s ease-in-out infinite alternate}
#orb1{width:260px;height:260px;background:#00ff88;top:-70px;left:-60px}
#orb2{width:200px;height:200px;background:#ffd700;bottom:-40px;right:-50px;animation-delay:-5s}
@keyframes of{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,26px) scale(1.15)}}
#scan{position:fixed;inset:0;z-index:60;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
.pt{position:absolute;border-radius:50%;animation:fl linear infinite;pointer-events:none;opacity:0}
@keyframes fl{0%{transform:translateY(0);opacity:0}12%{opacity:.85}85%{opacity:.5}100%{transform:translateY(-140px);opacity:0}}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
.neon{color:#eafff4;text-shadow:0 0 6px rgba(0,255,150,.8),0 0 18px rgba(0,255,150,.4)}
.gold{color:#ffd700;text-shadow:0 0 6px rgba(255,215,0,.7),0 0 18px rgba(255,180,0,.35)}
#page{position:fixed;top:0;bottom:56px;left:0;right:0;z-index:10;overflow-y:auto;padding:26px 14px 20px;-webkit-overflow-scrolling:touch}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;background:rgba(2,16,10,.96);border-top:1px solid rgba(0,255,157,.25)}
#nav button{flex:1;background:none;border:none;color:#3f8a6b;padding:8px 0 6px;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
#nav button.act{color:#00ff9d}
#nav button b{display:block;font-size:17px;margin-bottom:2px}
.hdr{display:flex;align-items:center;gap:10px}
h1{font-size:20px;letter-spacing:.06em;font-weight:900}
.sub{font-size:9px;letter-spacing:.24em;color:#8affd0;text-transform:uppercase}
.ver{font-size:9px;font-weight:700;color:#ffd700;border:1px solid rgba(255,215,0,.5);background:rgba(255,215,0,.08);padding:3px 8px;border-radius:99px}
.srch{display:flex;align-items:center;gap:8px;margin-top:12px;border:1px solid rgba(0,255,157,.3);background:rgba(3,21,14,.85);border-radius:12px;padding:10px 12px}
.srch input{flex:1;background:none;border:none;color:#eafff4;font-size:13px}
.banner{margin-top:10px;border:1px solid rgba(255,215,0,.4);border-radius:12px;padding:10px 12px;background:linear-gradient(120deg,rgba(255,215,0,.10),rgba(0,255,150,.08))}
.secl{margin:16px 0 8px;font-size:9px;letter-spacing:.3em;color:#3f8a6b;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{border:1px solid rgba(0,255,157,.25);background:rgba(4,21,14,.92);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cat:active{transform:scale(.95)}
.cat span.e{font-size:24px}
.cat span.n{font-size:11px;font-weight:700;margin-top:4px;line-height:1.15}
.cat span.c{margin-top:5px;font-size:8px;color:#ffd700;border:1px solid rgba(255,215,0,.4);padding:1px 7px;border-radius:99px}
.foot{margin:20px 0 10px;text-align:center;font-size:9px;letter-spacing:.3em;color:#2e6b50}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:34px;height:34px;border-radius:10px;border:1px solid rgba(0,255,157,.4);background:rgba(3,21,14,.9);color:#00ff9d;font-size:16px}
.ttl{flex:1;font-size:16px;font-weight:900;letter-spacing:.04em}
.cnt{font-size:9px;color:#ffd700;border:1px solid rgba(255,215,0,.5);padding:3px 9px;border-radius:99px}
.trow{width:100%;display:flex;align-items:center;gap:10px;border:1px solid rgba(0,255,157,.2);background:rgba(4,21,14,.9);border-radius:10px;padding:10px 12px;margin-bottom:8px;text-align:left}
.trow:active{background:rgba(0,255,157,.08)}
.trow .no{width:22px;font-size:10px;color:#ffd700;font-family:monospace}
.trow .nm{flex:1;font-size:12.5px;color:#eafff4}
.led{display:flex;align-items:center;gap:5px;font-size:8px;color:#00ff9d}
.dot{width:6px;height:6px;border-radius:50%;background:#00ff9d;box-shadow:0 0 6px #00ff9d}
.pn{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 20px;border:1px dashed rgba(0,255,157,.3);border-radius:14px;background:rgba(4,21,14,.7)}
.pn .i{font-size:34px}
.pn .t{margin-top:8px;font-size:15px;font-weight:900}
.pn .s{margin-top:8px;font-size:9px;color:#00ff9d;letter-spacing:.2em}
.pn p{margin-top:10px;font-size:11px;color:#7cc7a8;line-height:1.5}
.tin{width:100%;height:110px;background:rgba(3,21,14,.9);border:1px solid rgba(0,255,157,.3);border-radius:10px;color:#eafff4;padding:10px;font-size:13px;resize:vertical}
.fin{width:100%;background:rgba(3,21,14,.9);border:1px solid rgba(0,255,157,.3);border-radius:10px;color:#eafff4;padding:10px;font-size:13px;margin-top:4px}
.lb{display:block;font-size:10px;letter-spacing:.15em;color:#8affd0;margin-top:10px;text-transform:uppercase}
.btn{display:block;width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:.15em;color:#031209;background:linear-gradient(90deg,#00ff9d,#ffd700);text-align:center;text-decoration:none}
.btn2{display:inline-block;margin-top:12px;padding:9px 14px;border:1px solid rgba(0,255,157,.4);background:rgba(3,21,14,.9);border-radius:10px;font-size:11px;font-weight:700;color:#00ff9d}
.out{margin-top:12px;white-space:pre-wrap;word-break:break-all;background:rgba(3,21,14,.9);border:1px solid rgba(0,255,157,.2);border-radius:10px;padding:12px;font-size:12.5px;font-family:monospace;color:#eafff4}
.out b{color:#ffd700}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid rgba(0,255,157,.12);padding:8px 2px;font-size:11.5px}
.kv i{color:#8affd0;font-style:normal}
.kv b{color:#eafff4;text-align:right;max-width:60%;font-weight:400;word-break:break-all}
select.fin{appearance:none}
canvas.qr{background:#fff;border-radius:8px;margin-top:12px;padding:8px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pad button{padding:13px 0;border:1px solid rgba(0,255,157,.3);background:rgba(3,21,14,.95);color:#eafff4;border-radius:10px;font-size:15px;font-weight:700}
.disp{width:100%;background:#031209;border:1px solid rgba(0,255,157,.4);border-radius:10px;padding:12px;font-size:20px;font-family:monospace;color:#00ff9d;text-align:right;overflow-x:auto;white-space:nowrap}
.bigt{font-size:26px;font-weight:900;color:#00ff9d;text-align:center;margin-top:14px}
small.h{display:block;font-size:9px;color:#2e6b50;margin-top:6px;text-align:center;letter-spacing:.2em}
</style>
</head>
<body>

<div id="splash"></div>
<div id="page"></div>
<nav id="nav"></nav>

<script>

{name:"Utility & Daily",e:"🛠️",t:["Flashlight Torch","Mirror Camera","Ruler","Protractor","Bubble Level","Speedometer","Clinometer","Alarm Clock","Stopwatch","Timer","Pomodoro Timer","World Clock","Countdown","Calendar","Habit Tracker","Quick Notes","To-Do List","Reminder","Dice Roller","Coin Flip","Random Picker","Decision Wheel","Countdown Days","Name Picker","Price Compare"]},
{name:"AI Tools",e:"🤖",t:["Text Summarizer","Text Translator","Grammar Fixer","Paraphraser","AI Writer","Code Explainer","Code Generator","Regex Explainer","Regex Builder","Text to Emoji","Tone Analyzer","Keyword Extractor","Name Generator","Bio Generator","Email Writer","Poem Writer","Story Writer","Quote Maker","Slogan Maker","Resume Builder","Blog Outline","Product Description","Study Notes Maker","Flashcard Maker","Idea Brainstorm"]}];
var TOTAL=0;CATS.forEach(function(c){TOTAL+=c.t.length});
var IMPL={};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function db(k,v){try{if(v===undefined){var x=localStorage.getItem("gitb_"+k);return x?JSON.parse(x):null}localStorage.setItem("gitb_"+k,JSON.stringify(v))}catch(e){return null}}
var ridx=0;
function logo(sz,ring){
 var id="g"+(ridx++);
 var ring2=ring?'<g style="animation:spin 14s linear infinite;transform-origin:100px 88px"><circle cx="100" cy="88" r="82" fill="none" stroke="rgba(0,255,136,.35)" stroke-width="2" stroke-dasharray="10 14"/><circle cx="100" cy="88" r="74" fill="none" stroke="rgba(255,215,0,.3)" stroke-width="1.5" stroke-dasharray="2 10"/></g>':"";
 var extr="";[10,8,6,4,2].forEach(function(o){extr+='<text x="'+(100+o)+'" y="'+(118+o)+'" text-anchor="middle" fill="#7a5200" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="92">GI</text>'});
 return '<svg width="'+sz+'" height="'+(sz*0.85)+'" viewBox="0 0 200 170" style="filter:drop-shadow(0 0 14px rgba(255,200,40,.5)) drop-shadow(0 0 26px rgba(0,255,136,.25))"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff7c2"/><stop offset="30%" stop-color="#ffd700"/><stop offset="55%" stop-color="#f0b400"/><stop offset="100%" stop-color="#9a6b00"/></linearGradient></defs>'+ring2+extr+'<text x="100" y="118" text-anchor="middle" fill="url(#'+id+')" stroke="#5c3d00" stroke-width="2.5" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="92">GI</text><text x="100" y="70" text-anchor="middle" fill="rgba(255,255,255,.5)" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="92" style="clip-path:inset(0 0 62% 0)">GI</text></svg>';
}
function initSplash(){
 var p=$("page");p.style.display="none";
 $("splash").innerHTML='<div style="display:flex;flex-direction:column;align-items:center">'+logo(180,true)+'<h1 class="neon" style="font-family:Arial Black,sans-serif;font-size:32px;letter-spacing:.14em;margin-top:6px">GIToolbox</h1><p class="sub" style="margin-top:8px">ALL-IN-ONE · '+TOTAL+' FEATURES</p><div style="margin-top:22px;width:220px;height:5px;border:1px solid rgba(0,255,157,.3);border-radius:99px;overflow:hidden;background:#0c2b1e"><div id="spbar" style="height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#00ff9d,#ffd700);box-shadow:0 0 10px rgba(0,255,150,.8)"></div></div><div style="margin-top:20px">'+logo(54,false)+'</div><p class="gold" style="margin-top:4px;font-family:Arial Black,sans-serif;font-size:13px;font-weight:900;letter-spacing:.26em">POWERED BY I KO KO</p></div>';
 var w=0;var iv=setInterval(function(){w+=3;$("spbar").style.width=w+"%";if(w>=100){clearInterval(iv);setTimeout(closeSplash,250)}},80);
}
function closeSplash(){$("splash").classList.add("hide");$("page").style.display="block";navTo("home")}
function navTo(v){location.hash=v}
window.onhashchange=function(){clearTimers();render()};
function render(){
 var h=location.hash.replace("#","")||"home";
 var m;
 if(h==="home")renderHome();
 else if(h==="all")renderAll();
 else if(h==="about")renderAbout();
 else if((m=h.match(/^c\/(\d+)$/)))renderCat(+m[1]);
 else if((m=h.match(/^t\/(\d+)\/(\d+)$/)))renderTool(+m[1],+m[2]);
 else renderHome();
 renderNav(h);
}
function renderNav(h){
 var base=h.split("/")[0]||"home";
 var items=[["home","⌂","HOME"],["all","☰","TOOLS"],["about","★","ABOUT"]];
 $("nav").innerHTML=items.map(function(it){return '<button onclick="navTo(\''+it[0]+'\')" class="'+(base===it[0]?"act":"")+'"><b>'+it[1]+'</b>'+it[2]+'</button>'}).join("");
}
function renderHome(){
 var html='<div class="hdr">'+logo(50,false)+'<div style="flex:1"><h1 class="neon">GIToolbox</h1><p class="sub">'+TOTAL+' FEATURES · ALL-IN-ONE</p></div><span class="ver">v1.0</span></div>'
 +'<div class="srch"><span style="color:#00ff9d">⌕</span><input id="q" oninput="filterCats()" placeholder="Search 300+ tools..."/><button onclick="resetQ()" style="background:none;border:none;color:#3f8a6b">✕</button></div>'
 +'<div class="banner"><p style="font-size:13px;font-weight:900" class="gold">⚡ ALL-IN-ONE TOOLBOX</p><p style="font-size:10px;color:#bfe9d8;margin-top:2px">Cyber Edition · Green • Gold • Dark · POWERED BY I KO KO</p></div>'
 +'<p class="secl">CATEGORIES · '+CATS.length+'</p><div class="grid" id="cg"></div>'
 +'<p class="foot">POWERED BY I KO KO</p>';
 $("page").innerHTML=html;filterCats();
}
function resetQ(){$("q").value="";filterCats()}
function filterCats(){
 var q=($("q")?$("q").value:"").toLowerCase();
 var html="";var n=0;
 CATS.forEach(function(c,i){
  var hit=!q||c.name.toLowerCase().indexOf(q)>=0||c.t.some(function(t){return t.toLowerCase().indexOf(q)>=0});
  if(hit){n++;html+='<button class="cat" onclick="navTo(\'c/'+i+'\')"><span class="e">'+c.e+'</span><span class="n">'+esc(c.name)+'</span><span class="c">'+c.t.length+' TOOLS</span></button>'}
 });
 if(!n)html='<p style="grid-column:span 3;text-align:center;color:#3f8a6b;padding:24px 0;font-size:12px">No tool found</p>';
 $("cg").innerHTML=html;
}
function renderAll(){
 var html='<div class="hdr"><div style="flex:1"><h1 class="neon">All Tools</h1><p class="sub">'+TOTAL+' FEATURES</p></div><span class="cnt">'+CATS.length+' CATS</span></div>';
 CATS.forEach(function(c,i){
  html+='<p class="secl">'+c.e+' '+esc(c.name)+' · '+c.t.length+'</p>';
  html+=c.t.map(function(t,j){return toolRow(i,j,t)}).join("");
 });
 $("page").innerHTML=html;
}
function toolRow(ci,ti,t){
 return '<button class="trow" onclick="navTo(\'t/'+ci+'/'+ti+'\')"><span class="no">'+String(ti+1).padStart(2,"0")+'</span><span class="nm">'+esc(t)+'</span><span class="led"><span class="dot"></span>READY</span></button>';
}
function renderCat(ci){
 var c=CATS[ci];
 var html='<div class="thead"><button class="back" onclick="navTo(\'home\')">←</button><span style="font-size:20px">'+c.e+'</span><div class="ttl neon">'+esc(c.name)+'</div><span class="cnt">'+c.t.length+'</span></div>';
 html+=c.t.map(function(t,j){return toolRow(ci,j,t)}).join("");
 $("page").innerHTML=html;
}
function renderTool(ci,ti){
 var c=CATS[ci],t=c.t[ti];
 $("page").innerHTML='<div class="thead"><button class="back" onclick="navTo(\'c/'+ci+'\')">←</button><div class="ttl neon">'+esc(t)+'</div><span class="cnt">'+c.e+'</span></div><div id="tc"></div>';
 var box=$("tc");
 if(IMPL[t])IMPL[t](box);else panel(box,t);
}
function panel(box,name){
 box.innerHTML='<div class="pn"><div class="i">⚡</div><div class="t">'+esc(name)+'</div><div class="s"><span class="led"><span class="dot"></span>SLOT READY · '+TOTAL+' TOOL SUITE</span></div><p>This tool slot is reserved and registered in the suite. Its engine module ships with the next APK build update.</p><small class="h">POWERED BY I KO KO</small></div>';
}
function renderAbout(){
 $("page").innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center">'+logo(170,true)+'<h1 class="neon" style="font-family:Arial Black,sans-serif;font-size:24px;letter-spacing:.14em;margin-top:4px">GIToolbox</h1><p class="sub" style="margin-top:8px">ALL-IN-ONE · '+TOTAL+' FEATURES · V1.0</p><div style="margin-top:18px;border:1px solid rgba(255,215,0,.4);border-radius:12px;padding:12px 22px;background:rgba(255,215,0,.05)"><p class="gold" style="font-family:Arial Black,sans-serif;font-weight:900;letter-spacing:.26em;font-size:14px">POWERED BY I KO KO</p></div><p style="margin-top:16px;font-size:10px;color:#3f8a6b;line-height:1.7">CYBER EDITION — GREEN • GOLD • DARK<br/>MOST TOOLS RUN FULLY OFFLINE</p></div>';
}
var IOFN=null,FORMFN=null;
function ioUI(ph,btn){return '<textarea class="tin" id="ioin" placeholder="'+(ph||"Type or paste text here...")+'"></textarea><button class="btn" onclick="runIO()">'+(btn||"RUN")+'</button><div class="out" id="ioout" style="display:none"></div>'}
function regIO(name,fn,ph,btn){IMPL[name]=function(box){box.innerHTML=ioUI(ph,btn);IOFN=fn}}
function runIO(){var o=$("ioout");o.style.display="block";try{o.innerHTML=IOFN($("ioin").value)}catch(e){o.textContent="Error: "+e.message}}
function formUI(f,btn){
 var h="";

function wheelGo(){
 var opts=$("wo").value.split("\n").filter(function(l){return l.trim()});
 if(opts.length<2)opts=["YES","NO"];
 var cv=$("wcv"),x=cv.getContext("2d"),C=cv.width/2;
 var cols=["#00ff9d","#ffd700","#4dc9ff","#ff6ec7","#9dff00","#ff9d4d"];
 var rot=Math.random()*6.28,speed=0.25;
 function draw(){
  x.clearRect(0,0,cv.width,cv.height);
  opts.forEach(function(o,i){
   var a0=rot+i*2*Math.PI/opts.length,a1=a0+2*Math.PI/opts.length;
   x.beginPath();x.moveTo(C,C);x.arc(C,C,C-8,a0,a1);x.closePath();
   x.fillStyle=cols[i%cols.length];x.fill();
   x.save();x.translate(C,C);x.rotate((a0+a1)/2);
   x.fillStyle="#04150E";x.font="900 22px Arial";x.textAlign="right";
   x.fillText(o.slice(0,10),C-20,8);x.restore();
  });
  x.beginPath();x.moveTo(C-14,0);x.lineTo(C+14,0);x.lineTo(C,34);x.closePath();x.fillStyle="#ffd700";x.fill();
 }
 var step=setInterval(function(){
  rot+=speed;speed*=0.965;draw();
  if(speed<0.004){
   clearInterval(step);
   var idx=Math.floor(((3*Math.PI/2-rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)/(2*Math.PI)*opts.length)%opts.length;

IMPL["GPS Coordinates"]=function(box){gpsUI(box,"GPS Coordinates",function(s){$("sv").innerHTML=s.lat.toFixed(5)+", "+s.lon.toFixed(5)+"<br/><small>±"+s.acc.toFixed(0)+"m accuracy</small>"})};
IMPL["GPS Speed"]=function(box){gpsUI(box,"GPS Speed",function(s){$("sv").textContent=(s.spd*3.6).toFixed(1)+" km/h"})};
IMPL["Sound Meter"]=function(box){
 if(!natN(box,"Sound Meter"))return;
 box.innerHTML='<div class="bigt" id="sv">— dB</div><div style="height:6px;border-radius:99px;background:#0c2b1e;overflow:hidden;margin:12px 0"><div id="smb" style="height:100%;width:0%;background:linear-gradient(90deg,#00ff9d,#ffd700)"></div></div><button class="btn" id="smbtn" onclick="smTog()">🎤 START</button><small class="h">MICROPHONE · NATIVE AUDIO</small>'};
var SMON=false;
function smTog(){if(!NAT)return;SMON=!SMON;if(SMON){var r=GI.micStart();if(r==="ask"){$("sv").textContent="GRANT MIC PERMISSION, THEN TAP START AGAIN";SMON=false;return}if(r!=="ok"){$("sv").textContent="MIC ERROR";SMON=false;return}$("smbtn").textContent="⏹ STOP";natPoll(function(){var a=GI.micLevel();var db=Math.max(0,Math.round(20*Math.log10(a+1)));var el=$("sv");if(el)el.textContent=db+" dB";var b=$("smb");if(b)b.style.width=Math.min(100,db*1.6)+"%"},150)}else{GI.micStop();$("smbtn").textContent="🎤 START";$("sv").textContent="— dB";$("smb").style.width="0%"}}
IMPL["Vibration Test"]=function(box){
 box.innerHTML='<button class="btn" onclick="vibGo(200)">📳 SHORT (200ms)</button><button class="btn" style="background:rgba(3,21,14,.9);color:#00ff9d;border:1px solid rgba(0,255,157,.4)" onclick="vibGo(100,50,100,50,300)">📳 PATTERN</button><button class="btn" style="background:rgba(3,21,14,.9);color:#ffd700;border:1px solid rgba(255,215,0,.4)" onclick="vibGo(2000)">📳 LONG (2s)</button><small class="h">'+(NAT?"NATIVE VIBRATOR":"WEB VIBRATION API")+"</small>"};
function vibGo(){if(NAT){GI.vibrate(Array.prototype.slice.call(arguments).join(","));return}if(navigator.vibrate){var a=Array.prototype.slice.call(arguments);navigator.vibrate(a.length===1?a[0]:a)}}
/* ============ INIT ============ */
(function(){
 for(var i=0;i<24;i++){
  var p=document.createElement("span");p.className="pt";
  p.style.left=(i*37%100)+"%";p.style.top=(i*53%100)+"%";
  p.style.width=p.style.height=(1+(i*3%3)*2)+"px";
  p.style.background=i%5===0?"#ffd700":"#00ff9d";
  p.style.animationDuration=(6+(i*7%9))+"s";
  $("bg").appendChild(p);
 }
 var st=document.createElement("style");
 st.textContent="@keyframes spin{to{transform:rotate(360deg)}}";
 document.head.appendChild(st);
 initSplash();
})();
</script>
